<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keine Verbindung – Bauakte</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="bg-red-50 min-h-screen text-slate-800 flex items-center justify-center">
  <main class="text-center px-6">
    <svg class="mx-auto mb-6 text-red-600" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Keine Verbindung</h1>
    <p class="text-slate-500 mb-6">Bitte überprüfe deine Internetverbindung und versuche es erneut.</p>
    <button onclick="window.location.reload()"
      class="inline-block bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-3 rounded-xl transition cursor-pointer border-0">
      Neu laden
    </button>
  </main>
</body>
</html>
